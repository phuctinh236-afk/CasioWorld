<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nạp & Rút Tiền - Ví Lobby</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #131521;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: #131521;
            position: relative;
            padding-bottom: 70px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .header {
            padding: 12px 15px;
            background-color: #171a29;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #24293f;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }
        .back-btn {
            color: #cca352;
            text-decoration: none;
            font-size: 14px;
        }
        .wallet-card {
            background: linear-gradient(135deg, #2b2f45, #171a29);
            margin: 15px;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #303650;
            text-align: center;
        }
        .wallet-label {
            font-size: 13px;
            color: #9fa5b9;
            margin-bottom: 5px;
        }
        .wallet-balance {
            font-size: 24px;
            font-weight: bold;
            color: #cca352;
        }
        .tabs-container {
            display: flex;
            background-color: #171a29;
            margin: 0 15px;
            border-radius: 8px;
            padding: 4px;
            border: 1px solid #24293f;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #9fa5b9;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }
        .tab-btn.active {
            background-color: #cca352;
            color: #131521;
        }
        .form-section {
            padding: 15px;
            display: none;
        }
        .form-section.active {
            display: block;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #9fa5b9;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #171a29;
            border: 1px solid #303650;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #cca352;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #cca352, #b38f3e);
            border: none;
            border-radius: 8px;
            color: #131521;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .alert {
            margin: 0 15px 15px 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
        }
        .alert.success {
            background-color: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }
        .alert.error {
            background-color: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background-color: #171a29;
            border-top: 1px solid #24293f;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 900;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #7a83a0;
            font-size: 10px;
            gap: 3px;
        }
        .nav-item.active {
            color: #cca352;
        }
        .nav-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <a href="{{ url_for('index') }}" class="back-btn">‹ Trang chủ</a>
            <div class="header-title">Nạp & Rút Ví Tổng</div>
            <div style="width: 50px;"></div>
        </div>

        <!-- Số dư Ví Lobby -->
        <div class="wallet-card">
            <div class="wallet-label">💎 Số Dư Ví Lobby (Dùng chung tất cả game)</div>
            <div class="wallet-balance">{{ "{:,.0f}".format(balance) }} VND</div>
        </div>

        {% if message %}
        <div class="alert {{ msg_type }}">{{ message }}</div>
        {% endif %}

        <!-- Tab chuyển đổi Nạp / Rút -->
        <div class="tabs-container">
            <button type="button" class="tab-btn active" onclick="switchTab('deposit')" id="btn-deposit">Nạp Tiền (+)</button>
            <button type="button" class="tab-btn" onclick="switchTab('withdraw')" id="btn-withdraw">Rút Tiền (-)</button>
        </div>

        <!-- Form Nạp Tiền -->
        <form method="POST" class="form-section active" id="form-deposit">
            <input type="hidden" name="action" value="deposit">
            <div class="input-group">
                <label>Số tiền nạp vào Ví Lobby (VND):</label>
                <input type="number" name="amount" placeholder="Nhập số tiền..." min="10000" step="1000" required>
            </div>
            <button type="submit" class="submit-btn">Xác Nhận Nạp Tiền</button>
        </form>

        <!-- Form Rút Tiền -->
        <form method="POST" class="form-section" id="form-withdraw">
            <input type="hidden" name="action" value="withdraw">
            <div class="input-group">
                <label>Số tiền rút từ Ví Lobby (VND):</label>
                <input type="number" name="amount" placeholder="Nhập số tiền..." min="50000" step="1000" required>
            </div>
            <button type="submit" class="submit-btn" style="background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff;">Xác Nhận Rút Tiền</button>
        </form>

        <!-- Thanh điều hướng dưới -->
        <nav class="bottom-nav">
            <a href="{{ url_for('index') }}" class="nav-item">
                <div class="nav-icon">🏠</div>
                <span>Trang chủ</span>
            </a>
            <a href="{{ url_for('promotions') }}" class="nav-item">
                <div class="nav-icon">🎁</div>
                <span>Khuyến mãi</span>
            </a>
            <a href="{{ url_for('deposit') }}" class="nav-item active">
                <div class="nav-icon">💳</div>
                <span>Nạp tiền</span>
            </a>
            <a href="{{ url_for('profile') }}" class="nav-item">
                <div class="nav-icon">👤</div>
                <span>Tài khoản</span>
            </a>
        </nav>
    </div>

    <script>
        function switchTab(type) {
            document.getElementById('btn-deposit').classList.remove('active');
            document.getElementById('btn-withdraw').classList.remove('active');
            document.getElementById('form-deposit').classList.remove('active');
            document.getElementById('form-withdraw').classList.remove('active');

            if (type === 'deposit') {
                document.getElementById('btn-deposit').classList.add('active');
                document.getElementById('form-deposit').classList.add('active');
            } else {
                document.getElementById('btn-withdraw').classList.add('active');
                document.getElementById('form-withdraw').classList.add('active');
            }
        }
    </script>
</body>
</html>
