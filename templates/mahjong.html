<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Ways - TX68</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 10px; }
        
        .header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 10px 15px; border-radius: 12px; border: 1px solid #334155; }
        .balance-box { font-size: 13px; color: #94a3b8; text-align: right; }
        .balance-box span { display: block; font-size: 16px; font-weight: bold; color: #fbbf24; }
        .game-title { font-size: 16px; font-weight: bold; color: #f8fafc; }

        .slot-machine { width: 100%; max-width: 480px; background: linear-gradient(135deg, #7f1d1d, #450a0a); border: 4px solid #fbbf24; border-radius: 16px; padding: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); margin: 10px 0; }
        
        .multiplier-bar { display: flex; justify-content: space-around; background: rgba(0, 0, 0, 0.4); border-radius: 8px; padding: 6px; margin-bottom: 8px; border: 1px solid #b45309; }
        .mult-item { font-size: 14px; font-weight: bold; color: #94a3b8; padding: 2px 10px; border-radius: 6px; transition: 0.3s; }
        .mult-item.active { background: #fbbf24; color: #450a0a; text-shadow: none; box-shadow: 0 0 10px #fbbf24; transform: scale(1.1); }

        .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .reel-cell { background: #f8fafc; border-radius: 6px; aspect-ratio: 3/4; display: flex; align-items: center; justify-content: center; padding: 3px; position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); transition: opacity 0.3s ease; }
        .reel-cell.gold-border { border: 3px solid #fbbf24; background: #fef08a; box-shadow: 0 0 10px #f59e0b; }
        .reel-cell.dimmed { opacity: 0.25; filter: grayscale(50%); }
        .reel-cell.highlight-slow { opacity: 1; transform: scale(1.05); z-index: 2; box-shadow: 0 0 15px #ef4444; border: 3px solid #ef4444; }
        .reel-cell img { width: 100%; height: 100%; object-fit: contain; }

        .control-panel { width: 100%; max-width: 480px; background: #1e293b; padding: 12px; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
        .win-display { text-align: center; font-size: 15px; color: #34d399; font-weight: bold; min-height: 22px; }
        
        .actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .bet-control { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #94a3b8; }
        .bet-control select { background: #0f172a; color: #fbbf24; border: 1px solid #475569; padding: 6px; border-radius: 6px; font-weight: bold; font-size: 14px; }
        
        @keyframes spinRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spin-btn { width: 70px; height: 70px; background: radial-gradient(circle, #f59e0b 0%, #b45309 100%); color: #fff; border: 3px solid #fbbf24; border-radius: 50%; font-size: 28px; cursor: pointer; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.6); display: flex; align-items: center; justify-content: center; text-align: center; transition: 0.1s; flex-shrink: 0; }
        .spin-btn.rotating { animation: spinRotate 0.6s linear infinite; }
        .spin-btn:active { transform: scale(0.92); }
        .spin-btn:disabled { background: #475569; border-color: #64748b; cursor: not-allowed; box-shadow: none; }

        .auto-btn { background: #334155; color: #cbd5e1; border: 1px solid #475569; padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .auto-btn.active { background: #ef4444; color: #fff; border-color: #f87171; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }

        .back-link { color: #94a3b8; text-decoration: none; font-size: 12px; text-align: center; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <div class="game-title">🀄 Mahjong Ways</div>
        <div class="balance-box">Số dư: <span id="balance">{{ "{:,.0f}".format(balance).replace(",", ".") }}</span> VNĐ</div>
    </div>

    <div class="slot-machine">
        <div class="multiplier-bar">
            <div class="mult-item" id="mult-1">x1</div>
            <div class="mult-item" id="mult-2">x2</div>
            <div class="mult-item" id="mult-3">x3</div>
            <div class="mult-item" id="mult-5">x5</div>
        </div>
        <div class="grid-container" id="slot-grid"></div>
    </div>

    <div class="control-panel">
        <div class="win-display" id="win-text">Sẵn sàng chinh phục Mạt Chượt!</div>
        <div class="actions">
            <div class="bet-control">
                <span>Mức cược:</span>
                <select id="bet-amount">
                    <option value="0.2">0.2</option>
                    <option value="0.5">0.5</option>
                    <option value="1" selected>1.0</option>
                    <option value="2">2.0</option>
                    <option value="3">3.0</option>
                    <option value="5">5.0</option>
                    <option value="10">10.0</option>
                    <option value="20">20.0</option>
                    <option value="50">50.0</option>
                    <option value="100">100.0</option>
                </select>
            </div>
            
            <!-- Nút biểu tượng mũi tên cong giống ảnh 2 -->
            <button class="spin-btn" id="spin-btn" onclick="startSpin()">🔄</button>
            
            <button class="auto-btn" id="auto-btn" onclick="toggleAutoPlay()">AUTO</button>
        </div>
        <a href="/" class="back-link">← Quay lại trang chủ TX68</a>
    </div>

    <script>
        let balance = {{ balance }};
        let isSpinning = false;
        let isAutoPlaying = false;
        let autoTimer = null;
        
        const tiles = [
            "Man1.svg", "Man2.svg", "Man3.svg", "Man4.svg", "Man5.svg", "Man6.svg", "Man7.svg", "Man8.svg", "Man9.svg",
            "Pin1.svg", "Pin2.svg", "Pin3.svg", "Pin4.svg", "Pin5.svg", "Pin6.svg", "Pin7.svg", "Pin8.svg", "Pin9.svg",
            "Sou1.svg", "Sou2.svg", "Sou3.svg", "Sou4.svg", "Sou5.svg", "Sou6.svg", "Sou7.svg", "Sou8.svg", "Sou9.svg",
            "Ton.svg", "Nan.svg", "Shaa.svg", "Pei.svg",
            "Haku.svg", "Hatsu.svg", "Chun.svg"
        ];

        const rows = 4;
        const cols = 5;
        const totalCells = rows * cols;
        let currentMultiplierIndex = 0; 
        const multipliers = [1, 2, 3, 5];

        function updateMultiplierDisplay() {
            document.querySelectorAll('.mult-item').forEach((el, idx) => {
                if (idx === currentMultiplierIndex) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        function initGrid() {
            const grid = document.getElementById('slot-grid');
            grid.innerHTML = '';
            for (let i = 0; i < totalCells; i++) {
                const cell = document.createElement('div');
                cell.className = 'reel-cell';
                if (Math.random() < 0.25) {
                    cell.classList.add('gold-border');
                }
                const img = document.createElement('img');
                const randomTile = tiles[Math.floor(Math.random() * tiles.length)];
                img.src = `/static/assets/${randomTile}`;
                cell.dataset.tile = randomTile;
                cell.appendChild(img);
                grid.appendChild(cell);
            }
            currentMultiplierIndex = 0;
            updateMultiplierDisplay();
        }

        function startSpin() {
            if (isSpinning) return;

            const betMultiplier = parseFloat(document.getElementById('bet-amount').value);
            const betInput = betMultiplier * 5000; 

            if (balance < betInput) {
                alert("Số dư tài khoản không đủ để đặt cược!");
                stopAutoPlay();
                return;
            }

            isSpinning = true;
            balance -= betInput;
            updateBalance();
            document.getElementById('win-text').innerText = "";
            
            const spinBtn = document.getElementById('spin-btn');
            spinBtn.disabled = true;
            spinBtn.classList.add('rotating');
            
            currentMultiplierIndex = 0;
            updateMultiplierDisplay();

            // Xóa hiệu ứng cũ
            const cells = document.querySelectorAll('.reel-cell');
            cells.forEach(c => {
                c.classList.remove('dimmed', 'highlight-slow');
            });

            // Giai đoạn 1: Chạy quay liên tục từ trên xuống
            let spinInterval = setInterval(() => {
                cells.forEach(cell => {
                    const randomTile = tiles[Math.floor(Math.random() * tiles.length)];
                    cell.querySelector('img').src = `/static/assets/${randomTile}`;
                    cell.dataset.tile = randomTile;
                });
            }, 60);

            setTimeout(() => {
                clearInterval(spinInterval);
                
                // Đặt kết quả ngẫu nhiên cho các ô
                cells.forEach(cell => {
                    const randomTile = tiles[Math.floor(Math.random() * tiles.length)];
                    cell.querySelector('img').src = `/static/assets/${randomTile}`;
                    cell.dataset.tile = randomTile;
                    if (Math.random() < 0.2) cell.classList.add('gold-border');
                    else cell.classList.remove('gold-border');
                });

                // Giai đoạn 2: Hiệu ứng đặc biệt Mạt Chượt (Làm mờ phần lớn, chừa ô chờ khung vàng chạy chậm)
                let goldCells = Array.from(cells).filter(c => c.classList.contains('gold-border') || Math.random() < 0.15);
                
                if (goldCells.length > 0) {
                    cells.forEach(c => c.classList.add('dimmed'));
                    
                    // Chọn ngẫu nhiên 1 đến 2 ô đặc biệt để chạy chậm hồi hộp
                    let targetCell = goldCells[Math.floor(Math.random() * goldCells.length)];
                    targetCell.classList.remove('dimmed');
                    targetCell.classList.add('highlight-slow');

                    let slowInterval = setInterval(() => {
                        let rt = tiles[Math.floor(Math.random() * tiles.length)];
                        targetCell.querySelector('img').src = `/static/assets/${rt}`;
                        targetCell.dataset.tile = rt;
                    }, 150);

                    setTimeout(() => {
                        clearInterval(slowInterval);
                        targetCell.classList.remove('highlight-slow');
                        cells.forEach(c => c.classList.remove('dimmed'));
                        
                        evaluateWin(betInput);
                        finishSpinProcess(spinBtn);
                    }, 900);
                } else {
                    evaluateWin(betInput);
                    finishSpinProcess(spinBtn);
                }
            }, 800);
        }

        function finishSpinProcess(spinBtn) {
            isSpinning = false;
            spinBtn.disabled = false;
            spinBtn.classList.remove('rotating');

            if (isAutoPlaying) {
                autoTimer = setTimeout(() => {
                    if (isAutoPlaying) startSpin();
                }, 800);
            }
        }

        function toggleAutoPlay() {
            const autoBtn = document.getElementById('auto-btn');
            isAutoPlaying = !isAutoPlaying;

            if (isAutoPlaying) {
                autoBtn.classList.add('active');
                autoBtn.innerText = 'DỪNG';
                if (!isSpinning) {
                    startSpin();
                }
            } else {
                stopAutoPlay();
            }
        }

        function stopAutoPlay() {
            isAutoPlaying = false;
            clearTimeout(autoTimer);
            const autoBtn = document.getElementById('auto-btn');
            autoBtn.classList.remove('active');
            autoBtn.innerText = 'AUTO';
        }

        function evaluateWin(betInput) {
            let matchedSymbols = {};
            const cells = document.querySelectorAll('.reel-cell');
            
            cells.forEach(cell => {
                let t = cell.dataset.tile;
                matchedSymbols[t] = (matchedSymbols[t] || 0) + 1;
            });

            let totalWin = 0;
            let hasWon = false;

            for (let tile in matchedSymbols) {
                if (matchedSymbols[tile] >= 4) {
                    hasWon = true;
                    let baseMultiplier = matchedSymbols[tile] * 0.5;
                    totalWin += betInput * baseMultiplier;
                }
            }

            if (hasWon) {
                let multValue = multipliers[currentMultiplierIndex];
                totalWin = Math.floor(totalWin * multValue);
                balance += totalWin;

                document.getElementById('win-text').innerHTML = `🎉 NỔ HŨ (x${multValue}): +${totalWin.toLocaleString()} VNĐ!`;
                
                if (currentMultiplierIndex < multipliers.length - 1) {
                    currentMultiplierIndex++;
                }
                updateMultiplierDisplay();
            } else {
                document.getElementById('win-text').innerHTML = `Chúc bạn may mắn lần sau!`;
            }

            updateBalance();
        }

        function updateBalance() {
            document.getElementById('balance').innerText = balance.toLocaleString('vi-VN');
        }

        window.onload = initGrid;
    </script>
</body>
</html>
