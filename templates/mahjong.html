<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Ways - TX68</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: #110803; 
            color: #fff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            gap: 10px;
            padding: 10px; 
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        .header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(5px); padding: 10px 15px; border-radius: 12px; border: 1px solid #334155; }
        .balance-box { font-size: 13px; color: #94a3b8; text-align: right; }
        .balance-box span { display: block; font-size: 16px; font-weight: bold; color: #fbbf24; }
        .game-title { font-size: 16px; font-weight: bold; color: #f8fafc; }

        .slot-machine { width: 100%; max-width: 480px; background: linear-gradient(135deg, #50130a, #2a0503); border: 3px solid #b45309; border-radius: 16px; padding: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); margin: 5px 0; position: relative; }
        
        .freespin-badge { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #ef4444; color: #fff; padding: 3px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; border: 2px solid #fef08a; box-shadow: 0 0 10px #ef4444; display: none; z-index: 10; }

        /* Khung hệ số nhân x1 x2 x3 x5 */
        .multiplier-bar { display: flex; justify-content: space-around; background: rgba(0, 0, 0, 0.5); border-radius: 8px; padding: 6px; margin-bottom: 8px; border: 1px solid #854d0e; }
        .mult-item { font-size: 18px; font-weight: 900; color: #ca8a04; padding: 2px 12px; border-radius: 6px; transition: 0.3s; font-style: italic; }
        .mult-item.active { color: #fef08a; text-shadow: 0 0 10px #eab308, 0 0 20px #eab308; transform: scale(1.25); }

        .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: #15803d; padding: 6px; border-radius: 10px; border: 2px solid #166534; }
        .reel-window { height: 260px; overflow: hidden; position: relative; background: #166534; border-radius: 6px; }
        .reel-track { display: flex; flex-direction: column; gap: 4px; position: absolute; width: 100%; top: 0; left: 0; will-change: transform; }

        /* Thiết kế quân bài Mạt Chượt */
        .reel-cell { background: #f8fafc; color: #1e293b; border-radius: 6px; height: 61px; display: flex; align-items: center; justify-content: center; font-size: 32px; position: relative; box-shadow: inset 0 -3px 0 #cbd5e1, 0 2px 4px rgba(0,0,0,0.3); flex-shrink: 0; font-weight: bold; }
        .reel-cell.gold-border { border: 3px solid #eab308; background: #fef9c3; box-shadow: inset 0 -3px 0 #fde047, 0 0 10px #eab308; color: #854d0e; }
        
        /* QUÂN FREESPIN / SCATTER BẰNG HÌNH ẢNH FREESPIN.SVG */
        .reel-cell.scatter-cell { 
            background: linear-gradient(135deg, #fef08a 0%, #facc15 100%); 
            border: 3px solid #eab308; 
            box-shadow: inset 0 -3px 0 #fde047, 0 0 12px rgba(250, 204, 21, 0.8);
            padding: 3px;
        }
        .reel-cell.scatter-cell img {
            width: 88%;
            height: 88%;
            object-fit: contain;
            filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.4));
        }

        .reel-cell.wild-cell { background: linear-gradient(135deg, #fef08a, #eab308); color: #713f12; font-size: 13px; font-weight: 900; border: 2px solid #facc15; }

        /* Banner thông báo đỏ chạy chữ bên trên nút quay */
        .info-banner {
            width: 100%;
            max-width: 480px;
            background: linear-gradient(180deg, #991b1b, #450a0a);
            border: 2px solid #facc15;
            border-radius: 20px;
            padding: 6px 15px;
            text-align: center;
            color: #fef08a;
            font-weight: bold;
            font-size: 13px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            margin: 5px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Icon ảnh Scatter trong dải banner */
        .banner-scatter-img {
            height: 24px;
            width: auto;
            vertical-align: middle;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
        }

        /* Thanh thông số 3 ô bên dưới: Mức Cược, Tổng Cược, Tiền Thắng (WIN) */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 480px;
            gap: 6px;
            margin-bottom: 5px;
        }
        .stat-card {
            flex: 1;
            background: rgba(20, 10, 5, 0.85);
            border: 1px solid #78350f;
            border-radius: 8px;
            padding: 4px 8px;
            text-align: center;
        }
        .stat-label { font-size: 11px; color: #a1a1aa; text-transform: uppercase; }
        .stat-value { font-size: 13px; font-weight: bold; color: #38bdf8; }
        .stat-value.win { color: #4ade80; }

        .control-panel { width: 100%; max-width: 480px; background: rgba(20, 10, 5, 0.95); padding: 12px; border-radius: 16px; border: 1px solid #78350f; display: flex; flex-direction: column; gap: 8px; }
        
        .actions { display: flex; justify-content: space-around; align-items: center; gap: 8px; }
        
        .btn-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #27272a;
            border: 1px solid #52525b;
            color: #e4e4e7;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-circle.active { background: #dc2626; color: #fff; border-color: #f87171; }

        @keyframes spinRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spin-btn { 
            width: 72px; 
            height: 72px; 
            background: radial-gradient(circle, #facc15 0%, #ca8a04 70%, #854d0e 100%); 
            border: 3px solid #fef08a; 
            border-radius: 50%; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-shrink: 0; 
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.4);
        }
        .spin-icon {
            width: 38px;
            height: 38px;
            border: 4px solid #713f12;
            border-top-color: transparent;
            border-radius: 50%;
        }
        .spin-btn.rotating .spin-icon {
            animation: spinRotate 0.6s linear infinite;
        }
        .spin-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .bet-select {
            background: #18181b;
            color: #facc15;
            border: 1px solid #52525b;
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
        }

        .back-link { color: #a1a1aa; text-decoration: none; font-size: 12px; text-align: center; margin-top: 4px; display: block; }
        .back-link:hover { color: #fff; }
    </style>
</head>

                grid.appendChild(windowDiv);

            updateMultiplierDisplay();
            updateBetDisplay();

                    }

                        htmlContent += `<div class="reel-cell ${isGold}" data-tile="${finalT}">${finalT}</div>`;

                    }
                });
            });

                finishSpinProcess(spinBtn, betInput);

            }

                autoBtn.classList.add('active');
                if (!isSpinning) startSpin();
            } else {

            }
        }

            clearTimeout(autoTimer);

            autoBtn.classList.remove('active');

const multipliers = [1, 2, 3, 5];

function getScatterHTML() {
    return `<img src="/static/assets/freespin.svg" alt="FreeSpin" onerror="this.onerror=null; this.src='/static/assets/freespin.png';">`;
}

function updateMultiplierDisplay() {
    document.querySelectorAll('.mult-item').forEach((el, idx) => {
        if (idx === currentMultiplierIndex) {
            el.classList.add('active');
        } else {
            el.classList.remove('active');
        }
    });
}

function updateBetDisplay() {
    let val = parseFloat(document.getElementById('bet-amount').value);
    document.getElementById('disp-bet-base').innerText = val.toFixed(2);
    document.getElementById('disp-bet-total').innerText = (val * 5000).toLocaleString('vi-VN');
}

function initGrid() {
    const grid = document.getElementById('slot-grid');
    grid.innerHTML = '';
    
    for (let c = 0; c < cols; c++) {
        const windowDiv = document.createElement('div');
        windowDiv.className = 'reel-window';

        const trackDiv = document.createElement('div');
        trackDiv.className = 'reel-track';
        trackDiv.id = `reel-track-${c}`;

        for (let r = 0; r < rows; r++) {
            const cell = document.createElement('div');
            
            if (Math.random() < 0.18) {
                cell.className = 'reel-cell scatter-cell';
                cell.innerHTML = getScatterHTML();
                cell.dataset.tile = scatterTile;
            } else {
                cell.className = 'reel-cell';
                if (Math.random() < 0.2) cell.classList.add('gold-border');
                const randomTile = tiles[Math.floor(Math.random() * tiles.length)];
                cell.innerText = randomTile;
                cell.dataset.tile = randomTile;
            }
            trackDiv.appendChild(cell);
        }

        windowDiv.appendChild(trackDiv);
        grid.appendChild(windowDiv);
    }
    currentMultiplierIndex = 0;
    updateMultiplierDisplay();
    updateBetDisplay();
}

function startSpin() {
    if (isSpinning) return;

    const betMultiplier = parseFloat(document.getElementById('bet-amount').value);
    const betInput = betMultiplier * 5000; 

    if (freeSpinsLeft > 0) {
        freeSpinsLeft--;
        document.getElementById('freespin-badge').innerText = `MIỄN PHÍ: ${freeSpinsLeft}`;
        document.getElementById('info-banner').innerHTML = `TRONG CÁC VÒNG QUAY MIỄN PHÍ: CÒN ${freeSpinsLeft} LƯỢT`;
        if (freeSpinsLeft === 0) {
            document.getElementById('freespin-badge').style.display = 'none';
        }
    } else {
        if (balance < betInput) {
            alert("Số dư tài khoản không đủ!");
            stopAutoPlay();
            return;
        }
        balance -= betInput;
        updateBalance();
    }

    isSpinning = true;
    
    const spinBtn = document.getElementById('spin-btn');
    spinBtn.disabled = true;
    spinBtn.classList.add('rotating');
    
    currentMultiplierIndex = 0;
    updateMultiplierDisplay();

    let willTriggerFreeSpins = (Math.random() < 0.25 || freeSpinsLeft > 0);
    let finalGridData = [];

    for (let c = 0; c < cols; c++) {
        let colTiles = [];
        for (let r = 0; r < rows; r++) {
            let chosen = tiles[Math.floor(Math.random() * tiles.length)];
            if (willTriggerFreeSpins && c < 3 && r === 0 && Math.random() < 0.75) {
                chosen = scatterTile;
            }
            colTiles.push(chosen);
        }
        finalGridData.push(colTiles);
    }

    for (let c = 0; c < cols; c++) {
        const track = document.getElementById(`reel-track-${c}`);
        let htmlContent = '';
        for (let i = 0; i < 6; i++) {
            let randT = tiles[Math.floor(Math.random() * tiles.length)];
            htmlContent += `<div class="reel-cell">${randT}</div>`;
        }
        for (let r = 0; r < rows; r++) {
            let finalT = finalGridData[c][r];
            let isGold = Math.random() < 0.2 ? 'gold-border' : '';
            let isWild = (Math.random() < 0.08 && finalT !== scatterTile);
            
            if (finalT === scatterTile) {
                htmlContent += `<div class="reel-cell scatter-cell" data-tile="${scatterTile}">${getScatterHTML()}</div>`;
            } else if (isWild) {
                htmlContent += `<div class="reel-cell wild-cell" data-tile="WILD">WILD</div>`;
            } else {
                htmlContent += `<div class="reel-cell ${isGold}" data-tile="${finalT}">${finalT}</div>`;
            }
        }
        track.innerHTML = htmlContent;
        track.style.transition = 'none';
        track.style.transform = 'translate3d(0, 0px, 0)';
    }

    let spinDuration = isTurbo ? 350 : 700;

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            for (let c = 0; c < cols; c++) {
                const track = document.getElementById(`reel-track-${c}`);
                track.style.transition = `transform ${spinDuration}ms cubic-bezier(0.25, 1, 0.5, 1)`;
                let targetY = -6 * 65;
                track.style.transform = `translate3d(0, ${targetY}px, 0)`;
            }
        });
    });

    setTimeout(() => {
        finishSpinProcess(spinBtn, betInput);
    }, spinDuration + 50);
}

function finishSpinProcess(spinBtn, betInput) {
    let totalScatters = 0;
    const cells = document.querySelectorAll('.reel-cell');
    cells.forEach(cell => {
        if (cell.dataset.tile === scatterTile) totalScatters++;
    });

    if (totalScatters >= 3 && freeSpinsLeft === 0) {
        freeSpinsLeft = 12;
        const badge = document.getElementById('freespin-badge');
        badge.style.display = 'block';
        badge.innerText = `MIỄN PHÍ: ${freeSpinsLeft}`;
        document.getElementById('info-banner').innerHTML = "KÍCH HOẠT 12 VÒNG QUAY MIỄN PHÍ!";
    }

    evaluateWin(betInput);

    isSpinning = false;
    spinBtn.disabled = false;
    spinBtn.classList.remove('rotating');

    if (isAutoPlaying || freeSpinsLeft > 0) {
        autoTimer = setTimeout(() => {
            if (isAutoPlaying || freeSpinsLeft > 0) startSpin();
        }, isTurbo ? 400 : 800);
    }
}

function toggleAutoPlay() {
    const autoBtn = document.getElementById('auto-btn');
    isAutoPlaying = !isAutoPlaying;

    if (isAutoPlaying) {
        autoBtn.classList.add('active');
        if (!isSpinning) startSpin();
    } else {
        stopAutoPlay();
    }
}

function stopAutoPlay() {
    isAutoPlaying = false;
    clearTimeout(autoTimer);
    const autoBtn = document.getElementById('auto-btn');
    autoBtn.classList.remove('active');
}

function toggleTurbo() {
    isTurbo = !isTurbo;
    const turboBtn = document.getElementById('turbo-btn');
    if(isTurbo) turboBtn.classList.add('active');
    else turboBtn.classList.remove('active');
}

function evaluateWin(betInput) {
    let matchedSymbols = {};
    for (let c = 0; c < cols; c++) {
        const track = document.getElementById(`reel-track-${c}`);
        const allCellsInTrack = track.querySelectorAll('.reel-cell');
        for (let i = allCellsInTrack.length - rows; i < allCellsInTrack.length; i++) {
            if(allCellsInTrack[i]) {
                let t = allCellsInTrack[i].dataset.tile;
                if(t) matchedSymbols[t] = (matchedSymbols[t] || 0) + 1;
            }
        }
    }

    let totalWin = 0;
    let hasWon = false;

    for (let tile in matchedSymbols) {
        if (matchedSymbols[tile] >= 3 || tile === "WILD") {
            hasWon = true;
            let baseMultiplier = matchedSymbols[tile] * 0.4;
            totalWin += betInput * baseMultiplier;
        }
    }

    let luckFactor = (freeSpinsLeft > 0) ? 2 : 1;

    if (hasWon && totalWin > 0) {
        let multValue = multipliers[currentMultiplierIndex];
        totalWin = Math.floor(totalWin * multValue * luckFactor);
        
        if(totalWin > 999999) totalWin = 999999;

        balance += totalWin;

        document.getElementById('disp-win-amount').innerText = `${totalWin.toLocaleString('vi-VN')} đ`;

        if (currentMultiplierIndex < multipliers.length - 1) {
            currentMultiplierIndex++;
        }
        updateMultiplierDisplay();
    } else {
        document.getElementById('disp-win-amount').innerText = "0.00 đ";
    }

    updateBalance();
}

function updateBalance() {
    document.getElementById('balance').innerText = balance.toLocaleString('vi-VN');
}

window.onload = initGrid;
