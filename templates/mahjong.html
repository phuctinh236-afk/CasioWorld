<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Ways - TX68</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: radial-gradient(circle, #fef08a 0%, #ea580c 45%, #7c2d12 75%, #064e3b 100%); 
            color: #fff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            gap: 10px;
            padding: 10px; 
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        .header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(5px); padding: 10px 15px; border-radius: 12px; border: 1px solid #334155; }
        .balance-box { font-size: 13px; color: #94a3b8; text-align: right; }
        .balance-box span { display: block; font-size: 16px; font-weight: bold; color: #fbbf24; }
        .game-title { font-size: 16px; font-weight: bold; color: #f8fafc; }

        .slot-machine { width: 100%; max-width: 480px; background: linear-gradient(135deg, #7f1d1d, #450a0a); border: 4px solid #fbbf24; border-radius: 16px; padding: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.7); margin: 5px 0; position: relative; }
        
        .freespin-badge { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #ef4444; color: #fff; padding: 3px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; border: 2px solid #fef08a; box-shadow: 0 0 10px #ef4444; display: none; z-index: 10; }

        .multiplier-bar { display: flex; justify-content: space-around; background: rgba(0, 0, 0, 0.4); border-radius: 8px; padding: 6px; margin-bottom: 8px; border: 1px solid #b45309; }
        .mult-item { font-size: 14px; font-weight: bold; color: #94a3b8; padding: 2px 10px; border-radius: 6px; transition: 0.3s; }
        .mult-item.active { background: #fbbf24; color: #450a0a; text-shadow: none; box-shadow: 0 0 10px #fbbf24; transform: scale(1.1); }

        .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; background: #450a0a; padding: 4px; border-radius: 10px; }
        .reel-window { height: 275px; overflow: hidden; position: relative; background: #450a0a; border-radius: 6px; }
        .reel-track { display: flex; flex-direction: column; gap: 5px; position: absolute; width: 100%; top: 0; left: 0; will-change: transform; }

        .reel-cell { background: #f8fafc; border-radius: 6px; height: 65px; display: flex; align-items: center; justify-content: center; padding: 3px; position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); flex-shrink: 0; }
        .reel-cell.gold-border { border: 3px solid #fbbf24; background: #fef08a; box-shadow: 0 0 8px #f59e0b; }
        .reel-cell.scatter-glow { border: 3px solid #ef4444; background: #fee2e2; box-shadow: 0 0 12px #ef4444; }
        .reel-cell img { width: 100%; height: 100%; object-fit: contain; }

        .control-panel { width: 100%; max-width: 480px; background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(5px); padding: 12px; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
        .win-display { text-align: center; font-size: 15px; color: #34d399; font-weight: bold; min-height: 22px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        
        .actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .bet-control { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #94a3b8; }
        .bet-control select { background: #0f172a; color: #fbbf24; border: 1px solid #475569; padding: 6px; border-radius: 6px; font-weight: bold; font-size: 14px; }
        
        @keyframes spinRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spin-btn { 
            width: 76px; 
            height: 76px; 
            background: transparent; 
            border: none; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: transform 0.1s; 
            flex-shrink: 0; 
            padding: 0;
        }
        .spin-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }
        .spin-btn.rotating img {
            animation: spinRotate 0.8s linear infinite;
        }
        .spin-btn:active { transform: scale(0.92); }
        .spin-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .auto-btn { background: #334155; color: #cbd5e1; border: 1px solid #475569; padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .auto-btn.active { background: #ef4444; color: #fff; border-color: #f87171; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }

        .back-link { color: #cbd5e1; text-decoration: none; font-size: 12px; text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .back-link:hover { color: #fff; }

        .win-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .win-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .win-popup-wrapper {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            text-align: center;
            transform: scale(0.4);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .win-overlay.show .win-popup-wrapper {
            transform: scale(1);
        }
        .win-popup-img {
            width: 100%;
            max-width: 420px;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.8));
        }
        .win-popup-number {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            font-weight: 900;
            color: #ffeb3b;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 10px #ff9800;
            white-space: nowrap;
            letter-spacing: 1px;
        }

        .freespin-popup-box {
            background: linear-gradient(135deg, #064e3b, #022c22);
            border: 4px solid #34d399;
            padding: 30px 45px;
            border-radius: 20px;
            box-shadow: 0 0 50px #059669;
            text-align: center;
        }
        .freespin-popup-title {
            font-size: 24px;
            color: #fef08a;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .freespin-popup-desc {
            font-size: 34px;
            color: #34d399;
            font-weight: 900;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="game-title">🀄 Mahjong Ways</div>
        <div class="balance-box">Số dư: <span id="balance">{{ "{:,.0f}".format(balance).replace(",", ".") }}</span> VNĐ</div>
    </div>

    <div class="slot-machine">
        <div class="freespin-badge" id="freespin-badge">MIỄN PHÍ: 10</div>
        <div class="multiplier-bar">
            <div class="mult-item" id="mult-1">x1</div>
            <div class="mult-item" id="mult-2">x2</div>
            <div class="mult-item" id="mult-3">x3</div>
            <div class="mult-item" id="mult-5">x5</div>
        </div>
        <div class="grid-container" id="slot-grid"></div>
    </div>

    <div class="control-panel">
        <div class="win-display" id="win-text">Sẵn sàng chinh phục Mạt Chượt!</div>
        <div class="actions">
            <div class="bet-control">
                <span>Mức cược:</span>
                <select id="bet-amount">
                    <option value="0.2">0.2</option>
                    <option value="0.5">0.5</option>
                    <option value="1" selected>1.0</option>
                    <option value="2">2.0</option>
                    <option value="3">3.0</option>
                    <option value="5">5.0</option>
                    <option value="10">10.0</option>
                    <option value="20">20.0</option>
                    <option value="50">50.0</option>
                    <option value="100">100.0</option>
                </select>
            </div>
            
            <button class="spin-btn" id="spin-btn" onclick="startSpin()">
                <img src="{{ url_for('static', filename='assets/nutquay.svg') }}" onerror="this.src='{{ url_for('static', filename='assets/2098.svg') }}'" alt="Quay ngay">
            </button>
            
            <button class="auto-btn" id="auto-btn" onclick="toggleAutoPlay()">AUTO</button>
        </div>
        <a href="/" class="back-link">← Quay lại trang chủ TX68</a>
    </div>

    <div class="win-overlay" id="win-overlay" onclick="closeWinPopupEarly()">
        <div class="win-popup-wrapper" id="popup-content-box"></div>
                    </div>
        <script>
        let balance = {{ balance }};
        let isSpinning = false;
        let isAutoPlaying = false;
        let autoTimer = null;
        let freeSpinsLeft = 0;
        let activeCountInterval = null;
        let popupResolve = null;
        
        const tiles = [
            "Man1.svg", "Man2.svg", "Man3.svg", "Man4.svg", "Man5.svg", "Man6.svg", "Man7.svg", "Man8.svg", "Man9.svg",
            "Pin1.svg", "Pin2.svg", "Pin3.svg", "Pin4.svg", "Pin5.svg", "Pin6.svg", "Pin7.svg", "Pin8.svg", "Pin9.svg",
            "Sou1.svg", "Sou2.svg", "Sou3.svg", "Sou4.svg", "Sou5.svg", "Sou6.svg", "Sou7.svg", "Sou8.svg", "Sou9.svg",
            "Ton.svg", "Nan.svg", "Shaa.svg", "Pei.svg",
            "Haku.svg", "Hatsu.svg", "Chun.svg"
        ];

        const scatterTile = "Chun.svg";
        const rows = 4;
        const cols = 5;
        let currentMultiplierIndex = 0; 
        const multipliers = [1, 2, 3, 5];

        function updateMultiplierDisplay() {
            document.querySelectorAll('.mult-item').forEach((el, idx) => {
                if (idx === currentMultiplierIndex) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        function initGrid() {
            const grid = document.getElementById('slot-grid');
            grid.innerHTML = '';
            
            for (let c = 0; c < cols; c++) {
                const windowDiv = document.createElement('div');
                windowDiv.className = 'reel-window';

                const trackDiv = document.createElement('div');
                trackDiv.className = 'reel-track';
                trackDiv.id = `reel-track-${c}`;

                for (let r = 0; r < rows; r++) {
                    const cell = document.createElement('div');
                    cell.className = 'reel-cell';
                    if (Math.random() < 0.25) cell.classList.add('gold-border');
                    
                    const img = document.createElement('img');
                    const randomTile = tiles[Math.floor(Math.random() * tiles.length)];
                    img.src = `{{ url_for('static', filename='assets/') }}${randomTile}`;
                    cell.dataset.tile = randomTile;
                    cell.appendChild(img);
                    trackDiv.appendChild(cell);
                }

                windowDiv.appendChild(trackDiv);
                grid.appendChild(windowDiv);
            }
            currentMultiplierIndex = 0;
            updateMultiplierDisplay();
        }

        function startSpin() {
            if (isSpinning) return;

            const betMultiplier = parseFloat(document.getElementById('bet-amount').value);
            const betInput = betMultiplier * 5000; 

            if (freeSpinsLeft > 0) {
                freeSpinsLeft--;
                document.getElementById('freespin-badge').innerText = `MIỄN PHÍ: ${freeSpinsLeft}`;
                if (freeSpinsLeft === 0) {
                    document.getElementById('freespin-badge').style.display = 'none';
                }
            } else {
                if (balance < betInput) {
                    alert("Số dư tài khoản không đủ để đặt cược!");
                    stopAutoPlay();
                    return;
                }
                balance -= betInput;
                updateBalance();
            }

            isSpinning = true;
            document.getElementById('win-text').innerText = "";
            
            const spinBtn = document.getElementById('spin-btn');
            spinBtn.disabled = true;
            spinBtn.classList.add('rotating');
            
            currentMultiplierIndex = 0;
            updateMultiplierDisplay();

            let willTriggerFreeSpins = (Math.random() < 0.25 || freeSpinsLeft > 0);
            let finalGridData = [];

            for (let c = 0; c < cols; c++) {
                let colTiles = [];
                for (let r = 0; r < rows; r++) {
                    let chosen = tiles[Math.floor(Math.random() * tiles.length)];
                    if (willTriggerFreeSpins && c < 3 && r === 0 && Math.random() < 0.8) {
                        chosen = scatterTile;
                    }
                    colTiles.push(chosen);
                }
                finalGridData.push(colTiles);
            }

            for (let c = 0; c < cols; c++) {
                const track = document.getElementById(`reel-track-${c}`);
                let htmlContent = '';
                for (let i = 0; i < 8; i++) {
                    let randT = tiles[Math.floor(Math.random() * tiles.length)];
                    htmlContent += `<div class="reel-cell"><img src="{{ url_for('static', filename='assets/') }}${randT}"></div>`;
                }
                for (let r = 0; r < rows; r++) {
                    let finalT = finalGridData[c][r];
                    let isGold = Math.random() < 0.2 ? 'gold-border' : '';
                    let isScatter = finalT === scatterTile ? 'scatter-glow' : '';
                    htmlContent += `<div class="reel-cell ${isGold} ${isScatter}" data-tile="${finalT}"><img src="{{ url_for('static', filename='assets/') }}${finalT}"></div>`;
                }
                track.innerHTML = htmlContent;
                track.style.transition = 'none';
                track.style.transform = 'translate3d(0, 0px, 0)';
            }

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    for (let c = 0; c < cols; c++) {
                        const track = document.getElementById(`reel-track-${c}`);
                        track.style.transition = 'transform 1.0s cubic-bezier(0.25, 1, 0.5, 1)';
                        let targetY = -8 * 70;
                        track.style.transform = `translate3d(0, ${targetY}px, 0)`;
                    }
                });
            });

            setTimeout(() => {
                finishSpinProcess(spinBtn, betInput);
            }, 1050);
        }

        async function finishSpinProcess(spinBtn, betInput) {
            let totalScatters = 0;
            const cells = document.querySelectorAll('.reel-cell');
            cells.forEach(cell => {
                if (cell.dataset.tile === scatterTile) totalScatters++;
            });

            if (totalScatters >= 3 && freeSpinsLeft === 0) {
                freeSpinsLeft = 10;
                const badge = document.getElementById('freespin-badge');
                badge.style.display = 'block';
                badge.innerText = `MIỄN PHÍ: ${freeSpinsLeft}`;
                
                await showWinPopup("FREESPIN", 0);
            }

            await evaluateWin(betInput);

            isSpinning = false;
            spinBtn.disabled = false;
            spinBtn.classList.remove('rotating');

            if (isAutoPlaying || freeSpinsLeft > 0) {
                autoTimer = setTimeout(() => {
                    if (isAutoPlaying || freeSpinsLeft > 0) startSpin();
                }, 800);
            }
        }

        function toggleAutoPlay() {
            const autoBtn = document.getElementById('auto-btn');
            isAutoPlaying = !isAutoPlaying;

            if (isAutoPlaying) {
                autoBtn.classList.add('active');
                autoBtn.innerText = 'DỪNG';
                if (!isSpinning) {
                    startSpin();
                }
            } else {
                stopAutoPlay();
            }
        }

        function stopAutoPlay() {
            isAutoPlaying = false;
            clearTimeout(autoTimer);
            const autoBtn = document.getElementById('auto-btn');
            autoBtn.classList.remove('active');
            autoBtn.innerText = 'AUTO';
        }

        async function evaluateWin(betInput) {
            let matchedSymbols = {};
            for (let c = 0; c < cols; c++) {
                const track = document.getElementById(`reel-track-${c}`);
                const allCellsInTrack = track.querySelectorAll('.reel-cell');
                for (let i = allCellsInTrack.length - rows; i < allCellsInTrack.length; i++) {
                    if(allCellsInTrack[i]) {
                        let t = allCellsInTrack[i].dataset.tile;
                        if(t) matchedSymbols[t] = (matchedSymbols[t] || 0) + 1;
                    }
                }
            }

            let totalWin = 0;
            let hasWon = false;

            for (let tile in matchedSymbols) {
                if (matchedSymbols[tile] >= 4) {
                    hasWon = true;
                    let baseMultiplier = matchedSymbols[tile] * 0.5;
                    totalWin += betInput * baseMultiplier;
                }
            }

            let luckFactor = (freeSpinsLeft > 0) ? 2 : 1;

            if (hasWon || luckFactor > 1 && totalWin > 0) {
                let multValue = multipliers[currentMultiplierIndex];
                totalWin = Math.floor(totalWin * multValue * luckFactor);
                balance += totalWin;

                let freeText = freeSpinsLeft > 0 ? " (FREE SPIN x2)" : "";
                document.getElementById('win-text').innerHTML = `🎉 THẮNG${freeText}: +${totalWin.toLocaleString()} VNĐ!`;

                if (totalWin >= betInput * 25) {
                    await showWinPopup("MEGA WIN", totalWin);
                } else if (totalWin >= betInput * 10) {
                    await showWinPopup("BIG WIN", totalWin);
                }
                
                if (currentMultiplierIndex < multipliers.length - 1) {
                    currentMultiplierIndex++;
                }
                updateMultiplierDisplay();
            } else if (totalWin === 0 && freeSpinsLeft === 0) {
                document.getElementById('win-text').innerHTML = `Chúc bạn may mắn lần sau!`;
            }

            updateBalance();
        }

        function processImageWithoutCheckerboard(imgSrc, callback) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i];
                    let g = data[i+1];
                    let b = data[i+2];
                    
                    if (Math.abs(r - g) < 6 && Math.abs(g - b) < 6 && r > 150) {
                        data[i+3] = 0;
                    }
                }
                
                ctx.putImageData(imgData, 0, 0);
                callback(canvas.toDataURL('image/png'));
            };
            img.src = imgSrc;
        }

        function showWinPopup(type, targetAmount) {
            return new Promise((resolve) => {
                popupResolve = resolve;
                const overlay = document.getElementById('win-overlay');
                const popupBox = document.getElementById('popup-content-box');

                if (type === "BIG WIN") {
                    popupBox.innerHTML = `<img class="win-popup-img" id="dynamic-win-img" src="" alt="Big Win"><div class="win-popup-number" id="popup-amount">+0 VNĐ</div>`;
                    processImageWithoutCheckerboard("{{ url_for('static', filename='assets/bigwin.png') }}", function(processedSrc) {
                        const imgEl = document.getElementById('dynamic-win-img');
                        if (imgEl) imgEl.src = processedSrc;
                    });
                } else if (type === "MEGA WIN") {
                    popupBox.innerHTML = `<img class="win-popup-img" id="dynamic-win-img" src="" alt="Mega Win"><div class="win-popup-number" id="popup-amount">+0 VNĐ</div>`;
                    processImageWithoutCheckerboard("{{ url_for('static', filename='assets/megawin.png') }}", function(processedSrc) {
                        const imgEl = document.getElementById('dynamic-win-img');
                        if (imgEl) imgEl.src = processedSrc;
                    });
                } else if (type === "FREESPIN") {
                    popupBox.innerHTML = `
                        <div class="freespin-popup-box">
                            <div class="freespin-popup-title">🎉 Chúc mừng chiến thắng!</div>
                            <div class="freespin-popup-desc">10 LƯỢT QUAY MIỄN PHÍ</div>
                        </div>
                    `;
                }

                overlay.classList.add('show');

                if (type === "FREESPIN") {
                    setTimeout(() => {
                        closeWinPopupEarly();
                    }, 2500);
                    return;
                }

                let currentVal = 0;
                let steps = 40;
                let increment = Math.max(1, Math.floor(targetAmount / steps));
                let duration = 1500;
                let stepTime = duration / steps;

                const currentAmountEl = document.getElementById('popup-amount');
                if(currentAmountEl) currentAmountEl.innerText = "+0 VNĐ";
                
                if (activeCountInterval) clearInterval(activeCountInterval);

                let currentStep = 0;
                activeCountInterval = setInterval(() => {
                    currentStep++;
                    currentVal += increment;
                    if (currentStep >= steps || currentVal >= targetAmount) {
                        currentVal = targetAmount;
                        clearInterval(activeCountInterval);
                    }
                    const el = document.getElementById('popup-amount');
                    if(el) el.innerText = `+${currentVal.toLocaleString()} VNĐ`;
                }, stepTime);

                setTimeout(() => {
                    closeWinPopupEarly();
                }, 2800);
            });
        }

        function closeWinPopupEarly() {
            if (activeCountInterval) clearInterval(activeCountInterval);
            const overlay = document.getElementById('win-overlay');
            if (overlay.classList.contains('show')) {
                overlay.classList.remove('show');
                if (popupResolve) {
                    let temp = popupResolve;
                    popupResolve = null;
                    temp();
                }
            }
        }

        function updateBalance() {
            document.getElementById('balance').innerText = balance.toLocaleString('vi-VN');
        }

        window.onload = initGrid;
    </script>
</body>
</html>
