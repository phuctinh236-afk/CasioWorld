<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Ace Slot - TX68</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background: #0b0f19; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }

        /* HEADER */
        .top-bar { width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #141c2e; border-bottom: 1px solid #232d42; }
        .back-btn { color: #cca352; text-decoration: none; font-size: 14px; font-weight: bold; }
        .game-title { font-size: 18px; font-weight: 800; color: #f1c40f; letter-spacing: 1px; }

        /* MULTIPLIER BAR */
        .multiplier-container { width: 100%; max-width: 440px; padding: 10px 10px 0; }
        .multiplier-bar { display: flex; gap: 8px; justify-content: center; background: #141c2e; padding: 6px; border-radius: 8px; border: 1px solid #2e3e5c; }
        .mult-item { flex: 1; text-align: center; padding: 6px 0; border-radius: 6px; color: #64748b; font-weight: bold; font-size: 16px; transition: all 0.3s ease; }
        .mult-item.active { background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%); color: #fff; text-shadow: 0 1px 2px #000; box-shadow: 0 0 12px rgba(245, 158, 11, 0.6); }

        /* GAME BOARD (5x4) */
        .board-container { width: 100%; max-width: 440px; padding: 10px; }
        .grid-slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; background: #121929; padding: 8px; border-radius: 12px; border: 2px solid #2e3e5c; box-shadow: inset 0 0 15px #000; }
        
        .slot-card {
            aspect-ratio: 3/4;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            position: relative;
            transition: transform 0.1s, filter 0.1s;
        }
        
        .slot-card.gold {
            background: linear-gradient(145deg, #f59e0b, #78350f);
            border-color: #fef08a;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.5);
        }

        .slot-card .sym-val { font-size: 22px; line-height: 1; }
        .slot-card .sym-suit { font-size: 16px; margin-top: 4px; }
        .slot-card.spinning { filter: blur(3px); transform: translateY(4px); }

        /* Symbol Colors */
        .sym-A { color: #f1c40f; }
        .sym-K { color: #ef4444; }
        .sym-Q { color: #a855f7; }
        .sym-J { color: #3b82f6; }
        .sym-S { color: #10b981; }

        /* FOOTER & CONTROLS */
        .controls-panel { width: 100%; max-width: 480px; padding: 12px 16px; background: #141c2e; border-top: 1px solid #232d42; display: flex; flex-direction: column; gap: 10px; }
        .info-row { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; color: #94a3b8; }
        .val-text { color: #fff; }
        .win-text { color: #22c55e; }

        .action-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
        .bet-box { display: flex; align-items: center; gap: 10px; background: #0f172a; padding: 6px 12px; border-radius: 20px; border: 1px solid #334155; }
        .bet-btn { width: 32px; height: 32px; border-radius: 50%; background: #334155; color: #fff; border: none; font-size: 18px; font-weight: bold; cursor: pointer; }
        .bet-btn:active { background: #475569; }

        .spin-btn {
            flex: 1;
            height: 52px;
            border-radius: 26px;
            border: none;
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            cursor: pointer;
        }
        .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
    </style>
</head>
<body>

    <!-- TOP HEADER -->
    <div class="top-bar">
        <a href="{{ url_for('index') }}" class="back-btn">❮ Trang chủ</a>
        <div class="game-title">SUPER ACE</div>
        <div style="width: 60px;"></div>
    </div>

    <!-- MULTIPLIER BAR -->
    <div class="multiplier-container">
        <div class="multiplier-bar">
            <div class="mult-item active" id="m1">x1</div>
            <div class="mult-item" id="m2">x2</div>
            <div class="mult-item" id="m3">x3</div>
            <div class="mult-item" id="m5">x5</div>
        </div>
    </div>

    <!-- 5x4 GRID BOARD -->
    <div class="board-container">
        <div class="grid-slots" id="slotGrid">
            <!-- 20 ô thẻ sẽ được sinh ra bằng JS -->
        </div>
    </div>

    <!-- CONTROLS & FOOTER -->
    <div class="controls-panel">
        <div class="info-row">
            <span>Thắng: <span class="win-text" id="winDisplay">0.00</span></span>
            <span>Casino: <span class="val-text" id="balanceDisplay">0</span></span>
        </div>

        <div class="action-row">
            <div class="bet-box">
                <button class="bet-btn" onclick="changeBet(-0.5)">-</button>
                <span style="font-size: 14px; font-weight: bold;" id="betDisplay">Cược: 0.5</span>
                <button class="bet-btn" onclick="changeBet(0.5)">+</button>
            </div>

            <button class="spin-btn" id="spinBtn" onclick="spin()">QUAY</button>
        </div>
    </div>

    <script>
        const SYMBOLS = [
            { name: 'A', suit: '♠', class: 'sym-A', weight: 15, pay: 5 },
            { name: 'K', suit: '♔', class: 'sym-K', weight: 20, pay: 3 },
            { name: 'Q', suit: '♕', class: 'sym-Q', weight: 25, pay: 2 },
            { name: 'J', suit: '♘', class: 'sym-J', weight: 25, pay: 1 },
            { name: '♠', suit: '♠', class: 'sym-S', weight: 30, pay: 0.5 }
        ];

        let balance = {{ balance | int if balance is defined else 0 }};
        let currentBet = 1;
        let isSpinning = false;
        const GAME_NAME = 'Super Ace';

        const grid = document.getElementById('slotGrid');
        const spinBtn = document.getElementById('spinBtn');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const winDisplay = document.getElementById('winDisplay');
        const betDisplay = document.getElementById('betDisplay');

        async function serverBet(amount) {
            try {
                const res = await fetch('/api/game/play', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ amount: Math.round(amount), game: GAME_NAME })
                });
                const data = await res.json();
                if (!res.ok) {
                    alert(data.message || 'Không đủ Casino');
                    return false;
                }
                balance = data.balance;
                balanceDisplay.innerText = Number(balance).toLocaleString('vi-VN');
                return true;
            } catch (e) {
                alert('Lỗi kết nối');
                return false;
            }
        }

        async function serverWin(amount) {
            amount = Math.round(amount);
            if (amount <= 0) return;
            try {
                const res = await fetch('/api/game/win', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ amount: amount, game: GAME_NAME })
                });
                const data = await res.json();
                if (res.ok) {
                    balance = data.balance;
                    balanceDisplay.innerText = Number(balance).toLocaleString('vi-VN');
                }
            } catch (e) {}
        }

        // Tạo 20 ô mặc định
        function initGrid() {
            grid.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const card = document.createElement('div');
                card.className = 'slot-card';
                card.id = `card-${i}`;
                const sym = getRandomSymbol();
                card.innerHTML = `<span class="sym-val ${sym.class}">${sym.name}</span><span class="sym-suit ${sym.class}">${sym.suit}</span>`;
                grid.appendChild(card);
            }
        }

        function getRandomSymbol() {
            const rand = Math.random() * 115;
            let sum = 0;
            for (let sym of SYMBOLS) {
                sum += sym.weight;
                if (rand <= sum) return sym;
            }
            return SYMBOLS[4];
        }

        function changeBet(amount) {
            if (isSpinning) return;
            currentBet = Math.max(1, Math.round(currentBet + amount));
            betDisplay.innerText = `Cược: ${currentBet}`;
        }

        function setMultiplier(level) {
            document.querySelectorAll('.mult-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`m${level}`).classList.add('active');
        }

        async function spin() {
            if (isSpinning || balance < currentBet) {
                if (balance < currentBet) alert('Không đủ Casino!');
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            winDisplay.innerText = '0';
            setMultiplier(1);

            const ok = await serverBet(currentBet);
            if (!ok) {
                isSpinning = false;
                spinBtn.disabled = false;
                return;
            }

            const cards = document.querySelectorAll('.slot-card');
            cards.forEach(card => card.classList.add('spinning'));

            setTimeout(async () => {
                let generatedSymbols = [];
                cards.forEach((card, idx) => {
                    card.classList.remove('spinning');
                    const sym = getRandomSymbol();
                    const isGold = Math.random() < 0.15;
                    if (isGold) card.classList.add('gold');
                    else card.classList.remove('gold');
                    card.innerHTML = `<span class="sym-val ${sym.class}">${sym.name}</span><span class="sym-suit ${sym.class}">${sym.suit}</span>`;
                    generatedSymbols.push(sym);
                });

                await calculateWin(generatedSymbols);
                isSpinning = false;
                spinBtn.disabled = false;
            }, 800);
        }

        async function calculateWin(symbols) {
            let counts = {};
            symbols.forEach(s => counts[s.name] = (counts[s.name] || 0) + 1);

            let maxMatches = 0;
            let bestSymbol = null;
            for (let name in counts) {
                if (counts[name] > maxMatches) {
                    maxMatches = counts[name];
                    bestSymbol = SYMBOLS.find(s => s.name === name);
                }
            }

            let winVal = 0;
            if (maxMatches >= 4 && bestSymbol) {
                let mult = 1;
                if (maxMatches >= 7) mult = 5;
                else if (maxMatches >= 6) mult = 3;
                else if (maxMatches >= 5) mult = 2;

                setMultiplier(mult);
                winVal = Math.round(currentBet * bestSymbol.pay * mult * (maxMatches - 3));
                if (winVal > 0) {
                    await serverWin(winVal);
                    winDisplay.innerText = Number(winVal).toLocaleString('vi-VN');
                }
            }
        }

        // Hiển thị Casino ban đầu từ server
        balanceDisplay.innerText = Number(balance).toLocaleString('vi-VN');
        betDisplay.innerText = `Cược: ${currentBet}`;
        initGrid();
    </script>
</body>
                           </html>
