<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Casino World</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .header {
            padding: 12px 15px;
            background-color: #171a29;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border-bottom: 1px solid #24293f;
        }
        .balance-box {
            background: #212537;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #cca352;
            border: 1px solid #303650;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .banner {
            padding: 10px 15px;
        }
        .banner-box {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #2b2f45, #171a29);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #cca352;
            font-size: 15px;
            font-weight: bold;
            border: 1px solid #303650;
            text-align: center;
            padding: 10px;
        }
        .banner-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: #444c6e;
            border-radius: 50%;
        }
        .dot.active {
            background: #cca352;
            width: 16px;
            border-radius: 4px;
        }
        .game-tabs {
            display: flex;
            background-color: #1b1e2e;
            overflow-x: auto;
            padding: 8px 10px;
            gap: 8px;
            border-bottom: 1px solid #24293f;
            scrollbar-width: none;
        }
        .game-tabs::-webkit-scrollbar {
            display: none;
        }
        .g-tab {
            flex: 0 0 auto;
            background-color: #212537;
            border: 1px solid #303650;
            border-radius: 8px;
            padding: 8px 14px;
            text-align: center;
            color: #9fa5b9;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 65px;
        }
        .g-tab.active {
            background-color: #2b2f45;
            border-color: #cca352;
            color: #cca352;
            font-weight: bold;
        }
        .g-tab-icon {
            font-size: 18px;
        }
        .game-section {
            padding: 12px 10px 80px 10px;
        }
        .game-grid-detailed {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .game-item-card {
            background-color: #171a29;
            border: 1px solid #24293f;
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-item-card:hover {
            border-color: #cca352;
        }
        .game-thumb {
            width: 100%;
            height: 70px;
            background: #212537;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            border-bottom: 1px solid #24293f;
        }
        .game-name {
            padding: 6px 4px;
            font-size: 10px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="balance-box">💰 100.000 đ</div>
        </div>

        <!-- Banner -->
        <div class="banner">
            <div class="banner-box">
                🔥 KHUYẾN MÃI NẠP ĐẦU 100% 🔥
                <div class="banner-dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>

        <!-- Game Tabs -->
        <div class="game-tabs" id="category-tabs">
            <div class="g-tab active" onclick="switchTab(this, 'HOT')">
                <span class="g-tab-icon">🔥</span>
                <span>HOT</span>
            </div>
            <div class="g-tab" onclick="switchTab(this, 'DA_GA')">
                <span class="g-tab-icon">🐓</span>
                <span>ĐÁ GÀ</span>
            </div>
            <div class="g-tab" onclick="switchTab(this, 'SLOTS')">
                <span class="g-tab-icon">🎰</span>
                <span>Slots</span>
            </div>
            <div class="g-tab" onclick="switchTab(this, 'CASINO')">
                <span class="g-tab-icon">♠️</span>
                <span>Casino</span>
            </div>
            <div class="g-tab" onclick="switchTab(this, 'GAME_BAI')">
                <span class="g-tab-icon">🃏</span>
                <span>Game Bài</span>
            </div>
            <div class="g-tab" onclick="switchTab(this, 'BAN_CA')">
                <span class="g-tab-icon">🐟</span>
                <span>Bắn Cá</span>
            </div>
        </div>

        <!-- Game List -->
        <div class="game-section">
            <div class="game-grid-detailed" id="game-list">
                <div class="game-item-card" onclick="alert('Đang vào game Dragon Gems')">
                    <div class="game-thumb">🐉</div>
                    <div class="game-name">Dragon Gems</div>
                </div>
                <div class="game-item-card" onclick="alert('Đang vào game Mithai Madness')">
                    <div class="game-thumb">🍬</div>
                    <div class="game-name">Mithai Madness</div>
                </div>
                <div class="game-item-card" onclick="alert('Đang vào game Fortune Gems')">
                    <div class="game-thumb">💎</div>
                    <div class="game-name">Fortune Gems</div>
                </div>
                <div class="game-item-card" onclick="alert('Đang vào game Super Elements')">
                    <div class="game-thumb">⚡</div>
                    <div class="game-name">Super Elements</div>
                </div>
                <div class="game-item-card" onclick="alert('Đang vào game Ultra Ace')">
                    <div class="game-thumb">👑</div>
                    <div class="game-name">Ultra Ace</div>
                </div>
                <div class="game-item-card" onclick="alert('Đang vào game NCVIP Gates')">
                    <div class="game-thumb">⚡</div>
                    <div class="game-name">NCVIP Gates</div>
                </div>
                <div class="game-item-card" onclick="alert('Đang vào game Bountiful Birds')">
                    <div class="game-thumb">🦜</div>
                    <div class="game-name">Bountiful Birds</div>
                </div>
                <div class="game-item-card" onclick="alert('Đang vào game Aztec Treasure')">
                    <div class="game-thumb">🗿</div>
                    <div class="game-name">Aztec Treasure</div>
                </div>
            </div>
        </div>

        <!-- Bottom Nav -->
        <nav class="bottom-nav">
            <a href="/" class="nav-item active">
                <div class="nav-icon">🏠</div>
                <span>Trang chủ</span>
            </a>
            <a href="#" class="nav-item" onclick="alert('Tính năng khuyến mãi đang cập nhật')">
                <div class="nav-icon">🎁</div>
                <span>Khuyến mãi</span>
            </a>
            <a href="/deposit" class="nav-item">
                <div class="nav-icon">💳</div>
                <span>Nạp tiền</span>
            </a>
            <a href="/profile" class="nav-item">
                <div class="nav-icon">👤</div>
                <span>Tài khoản</span>
            </a>
        </nav>
    </div>

    <script>
        const gamesData = {
            'HOT': [
                {icon: '🐉', name: 'Dragon Gems'},
                {icon: '🍬', name: 'Mithai Madness'},
                {icon: '💎', name: 'Fortune Gems'},
                {icon: '⚡', name: 'Super Elements'},
                {icon: '👑', name: 'Ultra Ace'},
                {icon: '⚡', name: 'NCVIP Gates'},
                {icon: '🦜', name: 'Bountiful Birds'},
                {icon: '🗿', name: 'Aztec Treasure'}
            ],
            'DA_GA': [
                {icon: '🐓', name: 'Đá Gà Thomo'},
                {icon: '🔥', name: 'Đá Gà Cựa Sắt'}
            ],
            'SLOTS': [
                {icon: '🎰', name: 'Slot Thần Tài'},
                {icon: '💰', name: 'Kho Báu Aztec'}
            ],
            'CASINO': [
                {icon: '🎲', name: 'Baccarat Live'},
                {icon: '🎡', name: 'Roulette'}
            ],
            'GAME_BAI': [
                {icon: '♠️', name: 'Tiến Lên Miền Nam'},
                {icon: '♣️', name: 'Phỏm Tá Lả'}
            ],
            'BAN_CA': [
                {icon: '🐟', name: 'Bắn Cá Long Vương'},
                {icon: '🐠', name: 'Bắn Cá Hũ Thần'}
            ]
        };

        function switchTab(element, category) {
            document.querySelectorAll('.g-tab').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');

            const gameListContainer = document.getElementById('game-list');
            const items = gamesData[category] || [];
            
            let html = '';
            items.forEach(game => {
                html += `
                    <div class="game-item-card" onclick="alert('Đang vào ${game.name}')">
                        <div class="game-thumb">${game.icon}</div>
                        <div class="game-name">${game.name}</div>
                    </div>
                `;
            });
            gameListContainer.innerHTML = html;
        }
    </script>
</body>
</html>
