<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Casino World</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Top header bar */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background-color: #171a29;
            border-bottom: 1px solid #24293f;
        }
        .top-header .left-actions, .top-header .right-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }
        .top-header .title {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }

        /* Profile & Wallet Card (Giống ảnh 1705.jpg) */
        .user-wallet-section {
            padding: 12px 15px;
        }
        .profile-card {
            background: linear-gradient(135deg, #23273c, #171a29);
            border: 1px solid #303650;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 10px;
        }
        .profile-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #ebd08d, #cca352);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #131521;
        }
        .profile-texts .name {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
        }
        .profile-texts .sub {
            font-size: 11px;
            color: #cca352;
            margin-top: 2px;
        }
        .profile-arrow {
            color: #7a83a0;
            font-size: 16px;
        }

        /* Ví chính (Golden box giống ảnh 1705.jpg) */
        .wallet-main-box {
            background: linear-gradient(135deg, #dfbc68, #cca352);
            border-radius: 8px;
            padding: 12px 15px;
            color: #131521;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .wallet-left .w-title {
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #2b2208;
        }
        .wallet-left .w-balance {
            font-size: 18px;
            font-weight: bold;
            margin-top: 3px;
            color: #131521;
        }
        .wallet-icon-right {
            font-size: 22px;
            background: rgba(255, 255, 255, 0.2);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Search Bar */
        .search-container {
            padding: 0 15px 12px 15px;
        }
        .search-box {
            background-color: #212537;
            border: 1px solid #303650;
            border-radius: 8px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #7a83a0;
            font-size: 13px;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            width: 90%;
            outline: none;
            font-size: 13px;
        }

        /* Menu Grid (Phong cách ảnh 1705.jpg) */
        .menu-grid-section {
            padding: 0 15px 80px 15px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .menu-grid-item {
            background-color: #171a29;
            border: 1px solid #24293f;
            border-radius: 8px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .menu-grid-item:hover {
            border-color: #cca352;
        }
        .m-icon {
            font-size: 24px;
        }
        .m-label {
            font-size: 12px;
            color: #cca352;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Top Header Bar -->
        <div class="top-header">
            <div class="left-actions" onclick="location.href='/'">🏠</div>
            <div class="title">Ab666</div>
            <div class="right-actions" onclick="alert('Thêm tùy chọn')">⋮</div>
        </div>

        <!-- Profile & Wallet Section (Giống ảnh 1705.jpg) -->
        <div class="user-wallet-section">
            <div class="profile-card">
                <!-- Thông tin tài khoản & Hồ sơ -->
                <div class="profile-row" onclick="location.href='/profile'">
                    <div class="profile-info">
                        <div class="profile-logo">MC</div>
                        <div class="profile-texts">
                            <div class="name">Phun Cam Kiu</div>
                            <div class="sub">Hồ Sơ</div>
                        </div>
                    </div>
                    <div class="profile-arrow">➔</div>
                </div>

                <!-- Ví chính -->
                <div class="wallet-main-box" onclick="location.href='/deposit'">
                    <div class="wallet-left">
                        <div class="w-title">Ví chính 🔄</div>
                        <div class="w-balance">đ 100.000</div>
                    </div>
                    <div class="wallet-icon-right">💳</div>
                </div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <div class="search-box">
                <input type="text" placeholder="Tìm kiếm trò chơi...">
                <span>🔍</span>
            </div>
        </div>

        <!-- Menu Grid (Phong cách ảnh 1705.jpg) -->
        <div class="menu-grid-section">
            <div class="menu-grid">
                <div class="menu-grid-item" onclick="location.href='/deposit'">
                    <span class="m-icon">💳</span>
                    <span class="m-label">Nạp tiền</span>
                </div>
                <div class="menu-grid-item" onclick="location.href='/deposit'">
                    <span class="m-icon">🏧</span>
                    <span class="m-label">Rút tiền</span>
                </div>
                <div class="menu-grid-item" onclick="alert('Đang vào mục HOT')">
                    <span class="m-icon">🔥</span>
                    <span class="m-label">HOT</span>
                </div>
                <div class="menu-grid-item" onclick="alert('Đang vào Đá Gà')">
                    <span class="m-icon">🐓</span>
                    <span class="m-label">Đá Gà</span>
                </div>
                <div class="menu-grid-item" onclick="alert('Đang vào Slots')">
                    <span class="m-icon">🎰</span>
                    <span class="m-label">Slots</span>
                </div>
                <div class="menu-grid-item" onclick="alert('Đang vào Casino')">
                    <span class="m-icon">♠️</span>
                    <span class="m-label">Casino</span>
                </div>
                <div class="menu-grid-item" onclick="alert('Đang vào Game Bài')">
                    <span class="m-icon">🃏</span>
                    <span class="m-label">Game bài</span>
                </div>
                <div class="menu-grid-item" onclick="alert('Đang vào Bắn Cá')">
                    <span class="m-icon">🐟</span>
                    <span class="m-label">Bắn Cá</span>
                </div>
                <div class="menu-grid-item" onclick="alert('Đang vào Xổ Số')">
                    <span class="m-icon">🎱</span>
                    <span class="m-label">Xổ Số</span>
                </div>
                <div class="menu-grid-item" onclick="alert('Đang vào Thể Thao')">
                    <span class="m-icon">⚽</span>
                    <span class="m-label">Thể Thao</span>
                </div>
                <div class="menu-grid-item" onclick="alert('Đang vào Crash')">
                    <span class="m-icon">🚀</span>
                    <span class="m-label">Crash</span>
                </div>
                <div class="menu-grid-item" onclick="alert('Đang vào Arcade')">
                    <span class="m-icon">🕹️</span>
                    <span class="m-label">Arcade</span>
                </div>
                <div class="menu-grid-item" onclick="alert('Đang vào Khuyến Mãi')">
                    <span class="m-icon">🎁</span>
                    <span class="m-label">Khuyến mãi</span>
                </div>
                <div class="menu-grid-item" onclick="alert('Đang vào VIP')">
                    <span class="m-icon">⭐</span>
                    <span class="m-label">VIP</span>
                </div>
                <div class="menu-grid-item" onclick="alert('Đang tải xuống ứng dụng')">
                    <span class="m-icon">📥</span>
                    <span class="m-label">Tải xuống</span>
                </div>
            </div>
        </div>

        <!-- Bottom Nav -->
        <nav class="bottom-nav">
            <a href="/" class="nav-item active">
                <div class="nav-icon">🏠</div>
                <span>Trang chủ</span>
            </a>
            <a href="#" class="nav-item" onclick="alert('Tính năng khuyến mãi đang cập nhật')">
                <div class="nav-icon">🎁</div>
                <span>Khuyến mãi</span>
            </a>
            <a href="/deposit" class="nav-item">
                <div class="nav-icon">💳</div>
                <span>Nạp tiền</span>
            </a>
            <a href="/profile" class="nav-item">
                <div class="nav-icon">👤</div>
                <span>Tài khoản</span>
            </a>
        </nav>
    </div>
</body>
    </html>
