<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Casino - Trang chủ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .header {
            padding: 15px;
            background-color: #171a29;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #24293f;
        }
        .logo {
            color: #cca352;
            font-weight: bold;
            font-size: 18px;
        }
        .balance-box {
            background: #212537;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #cca352;
            border: 1px solid #303650;
        }
        .banner {
            padding: 15px;
        }
        .section-title {
            padding: 0 15px;
            font-size: 15px;
            font-weight: bold;
            color: #cca352;
            margin: 15px 0 10px 0;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 0 15px;
        }
        .game-card {
            background: #171a29;
            border: 1px solid #24293f;
            border-radius: 8px;
            padding: 20px 10px;
            text-align: center;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-card:hover {
            border-color: #cca352;
        }
        .game-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="logo">👑 MEGA CASINO</div>
            <div class="balance-box">💰 100.000 đ</div>
        </div>

        <!-- Banner -->
        <div class="banner">
            <div style="width:100%; height:140px; background: linear-gradient(135deg, #2b2f45, #171a29); border-radius:10px; display:flex; align-items:center; justify-content:center; color:#cca352; font-size:18px; border: 1px solid #303650; text-align: center; padding: 10px;">
                🔥 KHUYẾN MÃI NẠP ĐẦU 100% 🔥
            </div>
        </div>

        <!-- Game List -->
        <div class="section-title">🎮 Danh mục trò chơi</div>
        <div class="game-grid">
            <div class="game-card" onclick="alert('Đang vào sảnh Slot Game...')">
                <div class="game-icon">🎰</div>
                <span>Slot Game</span>
            </div>
            <div class="game-card" onclick="alert('Đang vào sảnh Casino Live...')">
                <div class="game-icon">🎲</div>
                <span>Live Casino</span>
            </div>
            <div class="game-card" onclick="alert('Đang vào sảnh Bắn Cá...')">
                <div class="game-icon">🐟</div>
                <span>Bắn Cá</span>
            </div>
            <div class="game-card" onclick="alert('Đang vào sảnh Thể Thao...')">
                <div class="game-icon">⚽</div>
                <span>Thể Thao</span>
            </div>
            <div class="game-card" onclick="alert('Đang vào sảnh Xổ Số...')">
                <div class="game-icon">🎟️</div>
                <span>Xổ Số</span>
            </div>
            <div class="game-card" onclick="alert('Đang vào sảnh Game Bài...')">
                <div class="game-icon">🃏</div>
                <span>Game Bài</span>
            </div>
        </div>

        <!-- Bottom Nav -->
        <nav class="bottom-nav">
            <a href="/" class="nav-item active">
                <div class="nav-icon">🏠</div>
                <span>Trang chủ</span>
            </a>
            <a href="#" class="nav-item" onclick="alert('Tính năng khuyến mãi đang cập nhật')">
                <div class="nav-icon">🎁</div>
                <span>Khuyến mãi</span>
            </a>
            <a href="/deposit" class="nav-item">
                <div class="nav-icon">💳</div>
                <span>Nạp tiền</span>
            </a>
            <a href="/profile" class="nav-item">
                <div class="nav-icon">👤</div>
                <span>Tài khoản</span>
            </a>
        </nav>
    </div>
</body>
    </html>
