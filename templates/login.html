<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - TX68</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: white; display: flex; align-items: center; justify-content: center; }
        .box { width: 90%; max-width: 380px; background: #0f172a; border-radius: 16px; padding: 30px 20px; border: 1px solid #334155; }
        h2 { text-align: center; color: #fbbf24; margin-bottom: 25px; font-size: 22px; }
        input { width: 100%; padding: 14px 16px; margin-bottom: 14px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 16px; }
        input:focus { outline: none; border-color: #fbbf24; }
        button { width: 100%; padding: 15px; background: linear-gradient(180deg, #f59e0b, #d97706); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        button:active { transform: scale(0.98); }
        .error { background: #7f1d1d; color: #fecaca; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 14px; }
        .back { display: block; text-align: center; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; }
        .register { display: block; text-align: center; margin-top: 12px; color: #fbbf24; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>TX68 - ĐĂNG NHẬP</h2>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Tên đăng nhập" required autocomplete="username">
            <input type="password" name="password" placeholder="Mật khẩu" required autocomplete="current-password">
            <button type="submit">ĐĂNG NHẬP</button>
        </form>

        <a href="/register" class="register">Chưa có tài khoản? Đăng ký ngay</a>
        <a href="/" class="back">← Quay lại trang chủ</a>
    </div>
</body>
</html>
