<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - TX68</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b1120;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 380px;
            background: #131c2e;
            border: 1px solid #263653;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,.35);
        }

        .logo {
            text-align: center;
            color: #f3a838;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 7px;
            border: 1px solid #334155;
            background: #0b1120;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #f3a838;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 7px;
            background: #f3a838;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        .error {
            display: none;
            background: rgba(239,68,68,.12);
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">🛡️ TX68 ADMIN</div>

    <div class="subtitle">
        Khu vực quản trị
    </div>

    <div id="error" class="error"></div>

    <form id="loginForm">

        <label>Tài khoản Admin</label>

        <input
            id="username"
            type="text"
            placeholder="Nhập tài khoản"
            autocomplete="username"
            required
        >

        <label>Mật khẩu</label>

        <input
            id="password"
            type="password"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
            required
        >

        <label style="display:flex;align-items:center;gap:8px;margin:6px 0 12px;font-size:13px;color:#94a3b8">
            <input type="checkbox" id="remember" checked style="width:auto"> Lưu TK/MK trên máy này
        </label>
        <button type="submit">
            ĐĂNG NHẬP
        </button>

    </form>

    <a class="back" href="/">
        ← Quay về trang chủ
    </a>

</div>

<script>
try {
  const u = localStorage.getItem('tx68_admin_user') || '';
  const p = localStorage.getItem('tx68_admin_pass') || '';
  if (u) document.getElementById('username').value = u;
  if (p) document.getElementById('password').value = p;
  if (localStorage.getItem('tx68_admin_remember') === '0')
    document.getElementById('remember').checked = false;
} catch(e) {}

const form = document.getElementById("loginForm");
const errorBox = document.getElementById("error");

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    errorBox.style.display = "none";

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    try {

        const response = await fetch("/admin/login", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.message || "Đăng nhập thất bại."
            );
        }

        // Session được backend lưu bằng cookie.
        // Không lưu mật khẩu trong localStorage.
        try {
          const rem = document.getElementById('remember').checked;
          if (rem) {
            localStorage.setItem('tx68_admin_user', username.toLowerCase());
            localStorage.setItem('tx68_admin_pass', password);
            localStorage.setItem('tx68_admin_remember', '1');
          } else {
            localStorage.removeItem('tx68_admin_user');
            localStorage.removeItem('tx68_admin_pass');
            localStorage.setItem('tx68_admin_remember', '0');
          }
        } catch(e){}
        window.location.href = "/admin";

    } catch (error) {

        errorBox.textContent =
            error.message || "Không thể kết nối máy chủ.";

        errorBox.style.display = "block";
    }

});
</script>

</body>
</html>
