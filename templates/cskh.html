<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSKH Trực Tuyến - Mega Casino World</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background-color: #131521;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #131521;
            position: relative;
            display: flex;
            flex-direction: column;
            padding-bottom: 125px; /* Tránh bị che bởi input bar và bottom nav */
        }

        /* Chat Header */
        .chat-header {
            padding: 12px 15px;
            background-color: #171a29;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #24293f;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
        }
        .agent-avatar {
            width: 36px;
            height: 36px;
            background: #2196f3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .agent-info h3 {
            margin: 0;
            font-size: 14px;
            color: #fff;
        }
        .agent-status {
            font-size: 11px;
            color: #4caf50;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }
        .agent-status::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #4caf50;
            border-radius: 50%;
            display: inline-block;
        }
        .chat-header-right {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }

        /* Chat Body / Messages */
        .chat-messages {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }
        .message-row {
            display: flex;
            gap: 10px;
            max-width: 85%;
        }
        .message-row.incoming {
            align-self: flex-start;
        }
        .message-row.outgoing {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg-bubble {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.4;
        }
        .incoming .msg-bubble {
            background-color: #1e2235;
            color: #fff;
            border-top-left-radius: 2px;
        }
        .outgoing .msg-bubble {
            background-color: #cca352;
            color: #131521;
            font-weight: 500;
            border-top-right-radius: 2px;
        }

        /* Chat Input Bar */
        .chat-input-container {
            position: fixed;
            bottom: 55px; /* Nằm ngay trên bottom nav */
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background-color: #171a29;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #24293f;
            z-index: 950;
        }
        .chat-input-field {
            flex: 1;
            background: #12141d;
            border: 1px solid #2b2f45;
            border-radius: 20px;
            padding: 10px 15px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .chat-input-field::placeholder {
            color: #7a83a0;
        }
        .send-btn {
            background: #cca352;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #131521;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background-color: #171a29;
            border-top: 1px solid #24293f;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 900;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #7a83a0;
            font-size: 10px;
            gap: 3px;
            cursor: pointer;
        }
        .nav-item.active {
            color: #cca352;
        }
        .nav-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Chat Header -->
        <div class="chat-header">
            <div class="chat-header-left">
                <button class="back-btn" onclick="window.location.href='./'">✕</button>
                <div class="agent-avatar">🎧</div>
                <div class="agent-info">
                    <h3>CSKH Trực Tuyến</h3>
                    <div class="agent-status">Đang hoạt động</div>
                </div>
            </div>
            <button class="chat-header-right" onclick="window.location.href='./'">✕</button>
        </div>

        <!-- Tin nhắn trong khung chat -->
        <div class="chat-messages" id="chatMessages">
            <div class="message-row incoming">
                <div class="msg-bubble">Xin chào, tôi có thể giúp gì cho bạn?</div>
            </div>
        </div>

        <!-- Khung nhập tin nhắn -->
        <div class="chat-input-container">
            <input type="text" class="chat-input-field" id="messageInput" placeholder="Nhập tin nhắn..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>

        <!-- Bottom Nav -->
        <nav class="bottom-nav">
            <a href="./" class="nav-item">
                <div class="nav-icon">🏠</div>
                <span>Trang Chủ</span>
            </a>
            <a href="#" class="nav-item" onclick="alert('Khuyến mãi'); return false;">
                <div class="nav-icon">🎁</div>
                <span>Khuyến Mãi</span>
            </a>
            <a href="profile.html" class="nav-item">
                <div class="nav-icon">💳</div>
                <span>Nạp - Rút</span>
            </a>
            <a href="cskh.html" class="nav-item active">
                <div class="nav-icon">💬</div>
                <span>CSKH 24/7</span>
            </a>
            <a href="profile.html" class="nav-item">
                <div class="nav-icon">👤</div>
                <span>Thành Viên</span>
            </a>
        </nav>
    </div>

    <script>
        function sendMessage() {
            const inputField = document.getElementById('messageInput');
            const messageText = inputField.value.trim();
            if (messageText === "") return;

            const chatMessages = document.getElementById('chatMessages');

            // Thêm tin nhắn của người dùng
            const userRow = document.createElement('div');
            userRow.className = 'message-row outgoing';
            userRow.innerHTML = `<div class="msg-bubble">${escapeHtml(messageText)}</div>`;
            chatMessages.appendChild(userRow);

            inputField.value = "";
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Giả lập phản hồi tự động từ CSKH sau 1 giây
            setTimeout(() => {
                const replyRow = document.createElement('div');
                replyRow.className = 'message-row incoming';
                replyRow.innerHTML = `<div class="msg-bubble">Cảm ơn bạn đã liên hệ. Hệ thống đã ghi nhận thông tin và sẽ hỗ trợ bạn ngay lập tức!</div>`;
                chatMessages.appendChild(replyRow);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 1000);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
