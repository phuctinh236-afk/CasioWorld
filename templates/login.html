<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - TX68</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: white; display: flex; align-items: center; justify-content: center; }
        .box { width: 90%; max-width: 380px; background: #0f172a; border-radius: 16px; padding: 30px 20px; border: 1px solid #334155; }
        h2 { text-align: center; color: #fbbf24; margin-bottom: 25px; font-size: 22px; }
        input { width: 100%; padding: 14px 16px; margin-bottom: 14px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 16px; }
        input:focus { outline: none; border-color: #fbbf24; }
        button { width: 100%; padding: 15px; background: linear-gradient(180deg, #f59e0b, #d97706); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        button:active { transform: scale(0.98); }
        .error { background: #7f1d1d; color: #fecaca; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 14px; }
        .links { text-align: center; margin-top: 18px; font-size: 14px; color: #94a3b8; }
        .links a { color: #fbbf24; text-decoration: none; }
        .remember { display:flex; align-items:center; gap:8px; margin: 4px 0 12px; font-size:13px; color:#94a3b8; }
        .remember input { width:auto; margin:0; }
    </style>
</head>
<body>
<div class="box">
    <h2>🎰 Đăng Nhập TX68</h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST" action="/login" id="loginForm">
        <input id="username" name="username" placeholder="Tên tài khoản" required autocomplete="username">
        <input id="password" name="password" type="password" placeholder="Mật khẩu" required autocomplete="current-password">
        <label class="remember"><input type="checkbox" id="remember" checked> Lưu tài khoản & mật khẩu trên máy này</label>
        <button type="submit">ĐĂNG NHẬP</button>
    </form>
    <div class="links">
        Chưa có tài khoản? <a href="/register">Đăng ký</a>
    </div>
</div>
<script>
(function(){
  try {
    const u = localStorage.getItem('tx68_user') || '';
    const p = localStorage.getItem('tx68_pass') || '';
    const r = localStorage.getItem('tx68_remember');
    if (u) document.getElementById('username').value = u;
    if (p && r !== '0') document.getElementById('password').value = p;
    if (r === '0') document.getElementById('remember').checked = false;
  } catch(e){}
  document.getElementById('loginForm').addEventListener('submit', function(){
    try {
      const rem = document.getElementById('remember').checked;
      const u = document.getElementById('username').value.trim().toLowerCase();
      const p = document.getElementById('password').value;
      if (rem) {
        localStorage.setItem('tx68_user', u);
        localStorage.setItem('tx68_pass', p);
        localStorage.setItem('tx68_remember', '1');
      } else {
        localStorage.removeItem('tx68_user');
        localStorage.removeItem('tx68_pass');
        localStorage.setItem('tx68_remember', '0');
      }
    } catch(e){}
  });
})();
</script>
</body>
</html>
